name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiln -d kiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KILN_TEST_DATABASE_URL: postgresql://kiln:kiln@127.0.0.1:5432/kiln
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e "./backend[dev]"
      - name: Lint
        working-directory: backend
        run: python -m ruff check .
      - name: Migrations ship inside the package
        run: |
          python -m venv /tmp/kiln-pkg
          /tmp/kiln-pkg/bin/pip install --disable-pip-version-check ./backend
          /tmp/kiln-pkg/bin/python -c "from pathlib import Path; import kiln.db.migrate as migrate; root = Path(migrate.__file__).resolve().parent / 'migrations' / 'versions'; files = [path for path in root.glob('*.py')]; assert files, root"
      - name: Start throwaway Jenkins and Gitea
        run: bash scripts/ci-external-services.sh start
      - name: Test
        working-directory: backend
        run: python -m pytest
      - name: Stop throwaway Jenkins and Gitea
        if: always()
        run: bash scripts/ci-external-services.sh stop

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        working-directory: console
        run: npm ci
      - name: Build
        working-directory: console
        run: npm run build

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config >/dev/null
