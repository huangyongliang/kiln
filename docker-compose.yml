# 本地开发用的 compose。默认只启动 Postgres、API 和控制台。
# profile `lab` 里的 Jenkins 与 Gitea 仍是占位，不会随 `docker compose up` 启动，
# 也不是共享实验机上已经在跑的那套。执行器和代码源地址来自环境变量。
# 容器名使用 kiln- 前缀。发布端口只绑在 127.0.0.1。容器内 API 仍监听 0.0.0.0。
# 这里的数据库口令和 KILN_API_TOKEN 默认值 kiln-local 只用于本地，不是生产密钥。
# 不要在这个文件里填写 Jenkins 或 Git 令牌。

name: kiln

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiln-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiln}
      POSTGRES_DB: ${POSTGRES_DB:-kiln}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kiln-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    image: kiln-api:local
    container_name: kiln-api
    environment:
      # API 启动时用这条连接串执行迁移，并读写账号、权限目录、制品、预约和 skill。
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kiln}:${POSTGRES_PASSWORD:-kiln}@postgres:5432/${POSTGRES_DB:-kiln}"
      KILN_API_TOKEN: ${KILN_API_TOKEN:-kiln-local}
      KILN_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-off}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      # 留空表示不连接。不要把令牌写进仓库。gitlab 是生产代码源，gitea 是实验室适配器。
      JENKINS_URL: ${JENKINS_URL:-}
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
      JENKINS_TIMEOUT_SECONDS: ${JENKINS_TIMEOUT_SECONDS:-30}
      GIT_PROVIDER: ${GIT_PROVIDER:-off}
      GIT_BASE_URL: ${GIT_BASE_URL:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_TIMEOUT_SECONDS: ${GIT_TIMEOUT_SECONDS:-30}
      # 平台自管制品字节。这不是 Nexus，也不发布新的宿主机端口。
      KILN_ARTIFACT_ROOT: /var/lib/kiln/artifacts
      KILN_ARTIFACT_MAX_BYTES: ${KILN_ARTIFACT_MAX_BYTES:-67108864}
    volumes:
      - kiln-artifact-data:/var/lib/kiln/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  console:
    build:
      context: ./console
    image: kiln-console:local
    container_name: kiln-console
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  jenkins:
    profiles: ["lab"]
    image: jenkins/jenkins:lts-jdk17
    container_name: kiln-jenkins
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - kiln-jenkins-home:/var/jenkins_home

  gitea:
    profiles: ["lab"]
    image: gitea/gitea:1.22
    container_name: kiln-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - kiln-gitea-data:/data

networks:
  default:
    name: kiln-net

volumes:
  kiln-postgres-data:
  kiln-artifact-data:
  kiln-jenkins-home:
  kiln-gitea-data:
